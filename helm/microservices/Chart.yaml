apiVersion: v2
name: microservices
description: A Helm chart for Node.js Microservices
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - nodejs
  - microservices
  - kubernetes
  - nx

home: https://github.com/your-org/node-microservices
sources:
  - https://github.com/your-org/node-microservices

maintainers:
  - name: Your Team
    email: team@example.com

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  
  - name: rabbitmq
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled 