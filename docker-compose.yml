# Docker Compose Configuration for Node.js Microservices
# =======================================================
# This file sets up the complete local development environment including:
# - Core infrastructure (PostgreSQL, Redis, RabbitMQ)
# - Monitoring stack (Prometheus, Grafana)
# - Development tools (pgAdmin, RabbitMQ Management)
#
# Usage:
#   Start all services:    docker-compose up -d
#   Stop all services:     docker-compose down
#   View logs:            docker-compose logs -f [service-name]
#   Reset everything:     docker-compose down -v
#
# Default Credentials:
#   PostgreSQL:  postgres/postgres
#   Redis:       auth: redis_password
#   RabbitMQ:    admin/admin
#   Grafana:     admin/admin
#   pgAdmin:     admin@example.com/admin

services:
  # ===========================================
  # Core Infrastructure Services
  # ===========================================
  
  # PostgreSQL - Primary Database
  # Used by: User Service, Auth Service, Notification Service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: microservices        # Main database name
      POSTGRES_USER: postgres          # Default superuser
      POSTGRES_PASSWORD: postgres      # CHANGE IN PRODUCTION!
    ports:
      - "5432:5432"                   # Host:Container port mapping
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & Session Store
  # Used by: Auth Service (sessions), API Gateway (rate limiting)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass redis_password  # Enable persistence & auth
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data              # Persist Redis data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ - Message Queue
  # Used by: Notification Service (async messaging)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin     # Management UI user
      RABBITMQ_DEFAULT_PASS: admin     # CHANGE IN PRODUCTION!
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Kong Gateway - API Gateway
  # ===========================================
  
  # Kong Database (PostgreSQL for Kong)
  kong-database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_password
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong Gateway Migration (runs once to set up database schema)
  kong-migration:
    image: kong:latest
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
    networks:
      - microservices-net
    depends_on:
      kong-database:
        condition: service_healthy

  # Kong Gateway
  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001  # Admin API
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002  # Kong Manager GUI
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
    ports:
      - "8000:8000"  # Proxy port (HTTP)
      - "8443:8443"  # Proxy port (HTTPS)
      - "8001:8001"  # Admin API
      - "8002:8002"  # Kong Manager GUI
      - "8444:8444"  # Admin API (HTTPS)
    volumes:
      - ./docker/kong:/kong/declarative
    networks:
      - microservices-net
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Konga Database (PostgreSQL with MD5 auth for compatibility)
  # Konga's pg library doesn't support SCRAM-SHA-256, so we use MD5 auth
  # NOTE: Using PostgreSQL 11 because Konga's sails-postgresql adapter uses
  # pg_constraint.consrc which was removed in PostgreSQL 12
  konga-database:
    image: postgres:11-alpine
    environment:
      POSTGRES_DB: konga
      POSTGRES_USER: konga
      POSTGRES_PASSWORD: konga_password
      POSTGRES_INITDB_ARGS: "--auth-host=md5"  # Use MD5 instead of SCRAM-SHA-256
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - konga_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konga -d konga"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Konga - Kong Admin UI (Alternative to Kong Manager)
  konga:
    image: pantsel/konga:latest
    environment:
      # Use development mode to auto-migrate database tables on startup
      NODE_ENV: development
      TOKEN_SECRET: ${KONGA_TOKEN_SECRET:-change-this-secret-in-production}
      DB_ADAPTER: postgres
      DB_HOST: konga-database
      DB_PORT: 5432
      DB_USER: konga
      DB_PASSWORD: konga_password
      DB_DATABASE: konga
      KONGA_HOOK_TIMEOUT: 120000
    ports:
      - "1337:1337"  # Konga UI
    networks:
      - microservices-net
    depends_on:
      konga-database:
        condition: service_healthy
      kong:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================
  # Monitoring & Observability Stack
  # ===========================================
  
  # Prometheus - Metrics Collection
  # Scrapes metrics from all microservices
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"    # Prometheus UI
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml  # Config file
      - prometheus_data:/prometheus                              # Time series data
    networks:
      - microservices-net

  # Grafana - Metrics Visualization
  # Pre-configured dashboards for microservices monitoring
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin      # Default admin password
      - GF_USERS_ALLOW_SIGN_UP=false         # Disable public registration
    ports:
      - "3001:3000"    # Avoid conflict with API Gateway on 3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning  # Auto-provision datasources & dashboards
    networks:
      - microservices-net
    depends_on:
      - prometheus

  # ===========================================
  # Development Tools
  # ===========================================
  
  # pgAdmin - PostgreSQL Management UI
  # Access at http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com    # Login email
      PGADMIN_DEFAULT_PASSWORD: admin             # Login password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - microservices-net
    depends_on:
      - postgres

  # Note: RabbitMQ Management UI is already included in the main RabbitMQ service
  # Access at http://localhost:15672

  stripe-service:
    build:
      context: .
      dockerfile: apps/stripe-service/Dockerfile
    env_file:
      - ./apps/stripe-service/.env
    ports:
      - '3333:3333'
    networks:
      - microservices-net

  stripe-frontend:
    build:
      context: .
      dockerfile: apps/stripe-frontend/Dockerfile
    ports:
      - '8080:80'
    environment:
      - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - stripe-service
    networks:
      - microservices-net

  # ===========================================
  # Keycloak - Identity Management
  # ===========================================
  
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start-dev
    ports:
      - "8180:8080"  # Changed to avoid conflict
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===========================================
  # Auth Services
  # ===========================================

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    image: auth-service:latest
    env_file:
      - ./apps/auth-service/.env
    ports:
      - '3334:3334'
    depends_on:
      - postgres
      - redis
      - keycloak
    networks:
      - microservices-net

  auth-frontend:
    build:
      context: .
      dockerfile: apps/auth-frontend/Dockerfile
    image: auth-frontend:latest
    ports:
      - '4200:80'
    environment:
      - VITE_KEYCLOAK_URL=http://localhost:8180
      - VITE_KEYCLOAK_REALM=microservices
      - VITE_KEYCLOAK_CLIENT_ID=auth-frontend
      - VITE_AUTH_SERVICE_URL=http://localhost:3334
    depends_on:
      - auth-service
      - keycloak
    networks:
      - microservices-net

# ===========================================
# Networks
# ===========================================
networks:
  microservices-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16  # Custom subnet to avoid conflicts

# ===========================================
# Volumes
# ===========================================
# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local
  kong_data:
    driver: local
  konga_data:
    driver: local
  keycloak_postgres_data:
    driver: local 