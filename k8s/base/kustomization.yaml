apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - api-gateway/
  - user-service/
  - auth-service/
  - notification-service/
  - ingress.yaml
  - network-policy.yaml

commonLabels:
  app.kubernetes.io/managed-by: nx
  app.kubernetes.io/part-of: node-microservices

images:
  - name: api-gateway
    newName: your-registry/api-gateway
    newTag: latest
  - name: user-service
    newName: your-registry/user-service
    newTag: latest
  - name: auth-service
    newName: your-registry/auth-service
    newTag: latest
  - name: notification-service
    newName: your-registry/notification-service
    newTag: latest 