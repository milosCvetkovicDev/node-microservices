apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: microservices
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    # Services represent the upstream APIs/microservices
    services:
      # User Service
      - name: user-service
        url: http://user-service:3001
        protocol: http
        port: 3001
        path: /
        retries: 5
        connect_timeout: 60000
        write_timeout: 60000
        read_timeout: 60000
        tags:
          - microservice
          - user
        routes:
          - name: user-service-route
            paths:
              - /api/users
            strip_path: false
            preserve_host: true
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            tags:
              - user-api

      # Auth Service
      - name: auth-service
        url: http://auth-service:3002
        protocol: http
        port: 3002
        path: /
        retries: 5
        connect_timeout: 60000
        write_timeout: 60000
        read_timeout: 60000
        tags:
          - microservice
          - auth
        routes:
          - name: auth-service-route
            paths:
              - /api/auth
            strip_path: false
            preserve_host: true
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            tags:
              - auth-api

      # Notification Service
      - name: notification-service
        url: http://notification-service:3003
        protocol: http
        port: 3003
        path: /
        retries: 5
        connect_timeout: 60000
        write_timeout: 60000
        read_timeout: 60000
        tags:
          - microservice
          - notification
        routes:
          - name: notification-service-route
            paths:
              - /api/notifications
            strip_path: false
            preserve_host: true
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            tags:
              - notification-api

      # Health Check Route
      - name: health-check
        url: http://user-service:3001/health
        protocol: http
        port: 3001
        path: /health
        tags:
          - health
        routes:
          - name: health-check-route
            paths:
              - /health
            methods:
              - GET
            tags:
              - health-api

    # Global Plugins
    plugins:
      # CORS Plugin
      - name: cors
        config:
          origins:
            - "*"  # Configure specific origins in production
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - X-Auth-Token
            - Authorization
          exposed_headers:
            - X-Auth-Token
          credentials: true
          max_age: 3600

      # Rate Limiting
      - name: rate-limiting
        config:
          minute: 100
          hour: 10000
          policy: local

      # Request/Response Logging
      - name: http-log
        config:
          http_endpoint: http://logging-service:9200/kong-logs
          method: POST
          timeout: 1000
          keepalive: 1000

      # Prometheus Metrics
      - name: prometheus
        config:
          per_consumer: true
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true 