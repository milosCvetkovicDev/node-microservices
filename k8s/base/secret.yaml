apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: microservices
type: Opaque
stringData:
  # Database Credentials (base64 encoded in real deployment)
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/microservices"
  REDIS_PASSWORD: "redis-password"
  # JWT Configuration
  JWT_SECRET: "your-super-secret-jwt-key"
  JWT_REFRESH_SECRET: "your-super-secret-refresh-key"
  # RabbitMQ Credentials
  RABBITMQ_USER: "admin"
  RABBITMQ_PASS: "admin-password"
  RABBITMQ_URL: "amqp://admin:admin-password@rabbitmq-service:5672"
  # External Services
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "notifications@example.com"
  SMTP_PASS: "smtp-password"
  # API Keys
  SENTRY_DSN: "https://your-sentry-dsn" 