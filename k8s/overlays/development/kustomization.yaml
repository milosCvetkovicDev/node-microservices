apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microservices-dev

bases:
  - ../../base

namePrefix: dev-
nameSuffix: ""

commonLabels:
  environment: development
  variant: dev

replicas:
  - name: api-gateway
    count: 1
  - name: user-service
    count: 1
  - name: auth-service
    count: 1
  - name: notification-service
    count: 1

images:
  - name: api-gateway
    newName: api-gateway
    newTag: latest
  - name: user-service
    newName: user-service
    newTag: latest
  - name: auth-service
    newName: auth-service
    newTag: latest
  - name: notification-service
    newName: notification-service
    newTag: latest

patchesStrategicMerge:
  - resources-patch.yaml

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug 