apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microservices-prod

bases:
  - ../../base

namePrefix: prod-
nameSuffix: ""

commonLabels:
  environment: production
  variant: prod

replicas:
  - name: api-gateway
    count: 5
  - name: user-service
    count: 3
  - name: auth-service
    count: 3
  - name: notification-service
    count: 2

images:
  - name: api-gateway
    newName: your-registry.io/api-gateway
    newTag: 1.0.0
  - name: user-service
    newName: your-registry.io/user-service
    newTag: 1.0.0
  - name: auth-service
    newName: your-registry.io/auth-service
    newTag: 1.0.0
  - name: notification-service
    newName: your-registry.io/notification-service
    newTag: 1.0.0

patchesStrategicMerge:
  - resources-patch.yaml
  - ingress-patch.yaml

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn

secretGenerator:
  - name: app-secrets
    behavior: merge
    envs:
      - secrets.env 